<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Volodya Music Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a record crate — sticky search bar, a dense wall of sleeves, a sheet that slides up for one record. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#14161c; --muted:#646a7a; --line:#dfe2ea;
  --accent:#2a44e6; --accent-ink:#ffffff; --chip:#e7e9f1; --shade:rgba(10,12,20,.45);
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1116; --surface:#181b23; --ink:#eceef4; --muted:#9097a8; --line:#272b36;
  --accent:#8c9cff; --accent-ink:#0f1116; --chip:#20242e; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1116; --surface:#181b23; --ink:#eceef4; --muted:#9097a8; --line:#272b36;
  --accent:#8c9cff; --accent-ink:#0f1116; --chip:#20242e; --shade:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{padding-block:22px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,30px);letter-spacing:-.01em;margin:0;line-height:1.05;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.bar>*{min-width:0}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:0 14px 0 38px}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select.btn{appearance:none;padding-right:14px}
.chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 12px;border-radius:999px;border:0;background:var(--chip);color:var(--ink);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

main{padding-block:16px 96px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr);gap:16px 12px}}
.tile{display:flex;flex-direction:column;gap:7px;background:none;border:0;padding:0;text-align:left;color:inherit;min-width:0}
.sleeve{position:relative;aspect-ratio:1;max-width:100%;border-radius:6px;overflow:hidden;background:var(--chip);box-shadow:0 1px 0 var(--line)}
.sleeve img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}
.tile:hover .sleeve img{transform:scale(1.03)}
.cat{position:absolute;left:6px;top:6px;font-family:var(--mono);font-size:10px;padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff;font-variant-numeric:tabular-nums}
.blank{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#fff}
.blank b{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.1;overflow-wrap:anywhere}
.blank span{font-family:var(--mono);font-size:10px;opacity:.85}
.meta{min-width:0}
.meta .t{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .a{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .y{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.flag{color:var(--accent)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.more{display:flex;justify-content:center;padding-top:26px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--shade);z-index:20;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:92%;overflow:auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.sleeve img{transition:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet .cover{width:min(100%,360px);aspect-ratio:1;margin:0 auto;border-radius:8px;overflow:hidden;position:relative;background:var(--chip)}
.sheet .cover img{width:100%;height:100%;object-fit:cover;display:block}
.sheet h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15;margin:18px 0 4px;text-wrap:balance;overflow-wrap:anywhere}
.sheet .who{font-size:16px;color:var(--muted);margin:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0}
.facts div{background:var(--surface);padding:10px 12px;min-width:0}
.facts dt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted);margin:0 0 14px}
.btn.small{height:32px;font-size:13px;flex:1;min-width:0;padding:0 10px;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tag{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font-size:12px}
.tag:hover{border-color:var(--accent);color:var(--accent)}
.filter-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;border:0;flex:none}
.filter-pill span{font-size:15px;line-height:1}
.actions{display:grid;grid-template-columns:1fr;gap:8px}
.actions a,.actions button{display:flex;align-items:center;justify-content:center;height:46px;border-radius:12px;text-decoration:none;font-weight:600}
.actions .go{background:var(--accent);color:var(--accent-ink)}
.actions .alt{background:var(--chip);color:var(--ink)}
.actions .off{background:var(--chip);color:var(--muted);border:0;cursor:default;font-size:13px;font-weight:500;text-align:center;line-height:1.2;padding:0 8px}
.close{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--chip);color:var(--ink);font-size:18px;line-height:1}
.proto{font-size:12px;color:var(--muted);text-align:center;padding-top:28px}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.vote button{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.vote button b{font-family:var(--mono);font-weight:500;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.vote button[aria-pressed="true"]{border-color:var(--accent);background:var(--chip);color:var(--accent)}
.vote button[aria-pressed="true"] b{color:var(--accent)}
.author{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:0 0 12px}
.author b{color:var(--ink);font-weight:600}
.sendbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sendbar span{flex:1;min-width:0;font-size:13px;line-height:1.3}
.sendbar button{flex:none;height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
.y .heart{color:var(--accent)}
.duel-entry{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:14px 0 2px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left}
.duel-entry b{font-weight:600}
.duel-entry span{color:var(--muted);font-size:13px}
.duel{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.duel-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.duel-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.duel-top .step{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.duel-bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.duel-bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.duel h3{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
.duel p{margin:0;color:var(--muted)}
.duel .dcover{width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--chip);position:relative}
.duel .dcover img{width:100%;height:100%;object-fit:cover;display:block}
.duel .dmeta b{display:block;font-size:17px;line-height:1.25}
.duel .dmeta span{color:var(--muted)}
.duel .answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duel .answers button{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.duel .answers button.wide{grid-column:1/-1;height:42px;font-weight:500;color:var(--muted)}
.duel .big{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.duel .rows{display:flex;flex-direction:column;gap:8px}
.duel .row{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--ink);text-align:left;width:100%}
.duel .row img,.duel .row .ph{width:44px;height:44px;border-radius:4px;object-fit:cover;flex:none;background:var(--chip)}
.duel .row div{min-width:0;font-size:13px;line-height:1.3}
.duel .row div b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duel .row div span{color:var(--muted)}
.duel .label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.duel .go{height:48px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;width:100%}
.duel .alt{height:44px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font-weight:500;width:100%}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>volodya music box</h1>
      <p>Архив всех альбомов из канала</p>
    </div>
    <div class="count" id="count">…</div>
  </header>

  <div class="bar">
    <div class="row">
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Альбом или исполнитель" autocomplete="off" aria-label="Поиск по архиву">
      </label>
      <button class="btn primary" id="rnd" type="button" title="Открыть случайный альбом">Наугад</button>
    </div>
    <div class="row">
      <button class="filter-pill" id="stylepill" type="button" hidden title="Сбросить стиль"></button>
      <div class="chips" id="decades" role="group" aria-label="Десятилетие"></div>
    </div>
    <div class="row">
      <select class="btn small" id="genre" aria-label="Жанр"><option value="">Все жанры</option></select>
      <select class="btn small" id="sort" aria-label="Сортировка">
        <option value="new">Сначала новые</option>
        <option value="old">Сначала старые</option>
        <option value="year">По году выхода</option>
        <option value="artist">По исполнителю</option>
        <option value="top">Народный топ</option>
      </select>
    </div>
  </div>

  <main>
    <button class="duel-entry" id="duel-entry" type="button">
      <div><b>Сравнить вкусы</b><br><span>15 альбомов, потом отправь другу и посмотри процент совпадения</span></div>
      <span aria-hidden="true">→</span>
    </button>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>Ничего не нашлось. Попробуй другое слово.</div>
    <div class="more"><button class="btn" id="more" type="button" hidden>Показать ещё</button></div>
    <p class="proto">Годы и жанры — из Discogs и MusicBrainz. Пополняется ботом @volodyamusicbox_bot.</p>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title" hidden>
  <div class="grab"></div>
  <button class="close" id="close" type="button" aria-label="Закрыть">×</button>
  <div class="cover" id="s-cover"></div>
  <h2 id="s-title"></h2>
  <p class="who" id="s-artist"></p>
  <dl class="facts" id="s-facts"></dl>
  <div class="tags" id="s-tags" hidden></div>
  <p class="author" id="s-author" hidden></p>
  <div class="vote" id="s-vote">
    <button type="button" data-v="1" aria-pressed="false">👍 Зашло <b id="s-likes">0</b></button>
    <button type="button" data-v="-1" aria-pressed="false">👎 Не зашло <b id="s-dislikes">0</b></button>
  </div>
  <p class="note" id="s-note" hidden></p>
  <div class="actions" id="s-actions"></div>
</section>

<section class="duel" id="duel" hidden aria-live="polite"><div class="duel-in" id="duel-in"></div></section>

<div class="sendbar" id="sendbar" hidden>
  <span id="sendbar-text"></span>
  <button type="button" id="sendbar-btn"></button>
</div>

<script>
(() => {
  const PAGE = 60;
  let all = [], view = [], shown = 0, decade = "all", style = "";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const norm = s => (s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/ё/g, "е");

  function hue(str){ let h = 0; for (const c of str || "?") h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
  function sleeveInner(a, big){
    const cat = `<span class="cat">№${a.id}</span>`;
    if (a.has_cover) return `<img src="covers/${a.id}.${a.cover_ext || "webp"}" data-id="${a.id}" alt="" loading="lazy" decoding="async">${big ? "" : cat}`;
    const h = hue(a.artist + a.title);
    return `<div class="blank" style="background:linear-gradient(150deg,hsl(${h} 45% 34%),hsl(${(h+40)%360} 50% 18%))">
      <span>№${a.id}</span><b>${esc(a.title)}</b><span>${esc(a.artist || "исполнитель?")}</span></div>`;
  }
  // Обложки, которых нет отдельным файлом, лежат пачками по 50 (covers/pack-N.json).
  const packs = {};
  window.coverFallback = img => {
    const id = +img.dataset.id; img.onerror = null;
    const k = Math.floor(id / 50);
    packs[k] = packs[k] || fetch(`covers/pack-${k}.json`).then(r => r.json()).catch(() => ({}));
    packs[k].then(p => { if (p[id]) img.src = p[id]; });
  };
  const decadeOf = a => a.year ? a.year.slice(0,3) + "0" : null;

  function buildGenres(){
    const c = {};
    all.forEach(a => (a.genres || []).forEach(g => c[g] = (c[g] || 0) + 1));
    $("genre").insertAdjacentHTML("beforeend", Object.entries(c).sort((x, y) => y[1] - x[1])
      .map(([g, n]) => `<option value="${esc(g)}">${esc(g)} · ${n}</option>`).join(""));
  }
  function setStyle(s){
    style = s || "";
    $("stylepill").hidden = !style;
    $("stylepill").innerHTML = style ? `${esc(style)} <span aria-hidden="true">×</span>` : "";
    apply();
  }
  function buildDecades(){
    const counts = {};
    all.forEach(a => { const d = decadeOf(a); if (d) counts[d] = (counts[d] || 0) + 1; });
    const ds = Object.keys(counts).sort();
    $("decades").innerHTML = [`<button class="chip" data-d="all" aria-pressed="true">все</button>`]
      .concat(ds.map(d => `<button class="chip" data-d="${d}" aria-pressed="false">${d.slice(2)}-е · ${counts[d]}</button>`)).join("");
  }

  function apply(){
    const q = norm($("q").value.trim());
    const g = $("genre").value;
    view = all.filter(a => (decade === "all" || decadeOf(a) === decade) &&
      (!g || (a.genres || []).includes(g)) &&
      (!style || (a.styles || []).includes(style)) &&
      (!q || norm(a.title + " " + (a.artist || "")).includes(q)));
    const s = $("sort").value;
    const by = {
      new: (x, y) => (y.added || "").localeCompare(x.added || ""),
      old: (x, y) => (x.added || "").localeCompare(y.added || ""),
      year: (x, y) => (x.year || "9999").localeCompare(y.year || "9999") || x.title.localeCompare(y.title),
      artist: (x, y) => (x.artist || "я").localeCompare(y.artist || "я", "ru") || (x.year || "").localeCompare(y.year || ""),
      top: (x, y) => { const [a1, d1] = counts(x), [a2, d2] = counts(y); return (a2 - d2) - (a1 - d1) || a2 - a1; },
    }[s];
    view.sort(by);
    shown = 0; $("grid").innerHTML = "";
    $("empty").hidden = view.length > 0;
    $("count").textContent = view.length === all.length ? `${all.length} альбомов` : `${view.length} из ${all.length}`;
    more();
  }

  function tileY(a){
    const l = counts(a)[0];
    return `${a.year || "год ?"}${a.styles ? " · " + esc(a.styles[0]) : ""}${l ? ` · <span class="heart">♥ ${l}</span>` : ""}${a.needs_fix ? ' <span class="flag">· уточнить</span>' : ""}`;
  }
  function more(){
    const chunk = view.slice(shown, shown + PAGE);
    $("grid").insertAdjacentHTML("beforeend", chunk.map(a => `
      <button class="tile" type="button" data-id="${a.id}">
        <div class="sleeve">${sleeveInner(a)}</div>
        <div class="meta">
          <div class="t">${esc(a.title)}</div>
          <div class="a">${esc(a.artist || "исполнитель неизвестен")}</div>
          <div class="y">${tileY(a)}</div>
        </div>
      </button>`).join(""));

  function open(id){

    $("scrim").hidden = false; $("sheet").hidden = false;

  function close(){

  function fromHash(){ const m = location.hash.match(/^#album-(\d+)$/); if (m) open(+m[1]); }
  // Внутри Telegram: тема, растяжка на весь экран и открытие альбома по ссылке ?startapp=album_N

  }
  // ---------- оценки ----------
  // cur — мои оценки сейчас, sent — те, что уже ушли боту. Разница = «не отправлено».
  // Хранятся в облаке Telegram (видны на всех устройствах) и в браузере на всякий случай.
  const inTg = !!(tgApp && tgApp.initData);
  const canSend = inTg && new URLSearchParams(location.search).get("from") === "kb";
  const cloud = inTg && tgApp.CloudStorage && tgApp.isVersionAtLeast && tgApp.isVersionAtLeast("6.9") ? tgApp.CloudStorage : null;
  let cur = {}, sent = {};
  function saveVotes(){
    const s = JSON.stringify({cur, sent});
    try { localStorage.setItem("votes", s); } catch (e) {}
    if (!cloud) return Promise.resolve();
    const parts = s.match(/[\s\S]{1,3500}/g) || [""];
    const jobs = parts.map((part, i) => new Promise(r => cloud.setItem("v" + i, part, () => r())));
    jobs.push(new Promise(r => cloud.setItem("vn", String(parts.length), () => r())));
    return Promise.all(jobs);
  }
  function loadVotes(){
    try { const s = JSON.parse(localStorage.getItem("votes") || "{}"); cur = s.cur || {}; sent = s.sent || {}; } catch (e) {}
    if (!cloud) return Promise.resolve();
    return new Promise(res => cloud.getItem("vn", (err, n) => {
      n = parseInt(n || "0", 10);
      if (err || !n) return res();
      const keys = Array.from({length: n}, (_, i) => "v" + i);
      cloud.getItems(keys, (err2, vals) => {
        try {
          if (!err2) { const s = JSON.parse(keys.map(k => vals[k] || "").join("")); cur = s.cur || {}; sent = s.sent || {}; }
        } catch (e) {}
        res();
      });
    }));
  }
  function pending(){
    const diff = {};
    new Set([...Object.keys(cur), ...Object.keys(sent)]).forEach(id => {
      if ((cur[id] || 0) !== (sent[id] || 0)) diff[id] = cur[id] || 0;
    });
    return diff;
  }
  // счётчики с учётом моих свежих, ещё не отправленных оценок
  function counts(a){
    const id = String(a.id), was = sent[id] || 0, now = cur[id] || 0;
    return [(a.likes || 0) - (was === 1) + (now === 1), (a.dislikes || 0) - (was === -1) + (now === -1)];
  }
  function vote(id, v){
    id = String(id);
    if (cur[id] === v) delete cur[id]; else cur[id] = v;

    const a = all.find(x => String(x.id) === id), y = document.querySelector(`.tile[data-id="${id}"] .y`);
    if (a && y) y.innerHTML = tileY(a);

  }
  let openId = null;
  function paintVote(){
    const a = all.find(x => x.id === openId); if (!a) return;
    const [l, d] = counts(a), my = cur[String(a.id)] || 0;
    $("s-likes").textContent = l; $("s-dislikes").textContent = d;
    $("s-vote").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.v === my));
  }
  function paintSendbar(){
    const n = Object.keys(pending()).length;

    if (!n || !inTg) return;
    $("sendbar-text").textContent = canSend
      ? `Оценок не отправлено: ${n}. Отправь, чтобы их увидели все.`
      : `Оценок: ${n}. Чтобы их увидели все, открой архив через бота.`;

  function send(){
    if (!canSend) { tgApp.openTelegramLink("https://t.me/volodyamusicbox_bot?start=rate"); return; }
    const diff = pending(), ids = Object.keys(diff).slice(0, 300);   // лимит сообщения — 4 КБ
    const batch = {}; ids.forEach(id => batch[id] = diff[id]);
    ids.forEach(id => { if (batch[id] === 0) delete sent[id]; else sent[id] = batch[id]; });

  }

  // ---------- сравнение вкусов ----------
  // Дуэль хранится на нашем сервере (Cloudflare): одна дуэль — одно сообщение — один соперник.
  // Кто первым ответил, тот и соперник; повторный вход показывает результат, а не тест заново.
  const Duel = (() => {
    const N = 15;
    let set = [], mine = [], d = null, idx = 0;
    const byId = id => all.find(a => a.id === id);
    const cover = a => a.has_cover ? `<img src="covers/${a.id}.${a.cover_ext || "webp"}" alt="">` : `<div class="ph"></div>`;
    const top = label => `<div class="duel-top"><span class="step">${label}</span><button class="alt" style="width:auto;padding:0 12px" data-x="close">Закрыть</button></div>`;
    function show(html){ $("duel-in").innerHTML = html; $("duel").hidden = false; $("duel").scrollTop = 0; }
    function hide(){ $("duel").hidden = true; }
    function fail(msg){ show(`${top("Сравнение вкусов")}<h3>${esc(msg)}</h3><button class="alt" data-x="close">Вернуться в архив</button>`); }

    async function call(path, body){
      const init = inTg ? tgApp.initData : "";
      const r = body
        ? await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({...body, initData: init})})
        : await fetch(path + "?initData=" + encodeURIComponent(init));
      return r.json();
    }

    function pick(){
      const pool = all.filter(a => a.has_cover && a.artist), byDec = {};
      pool.forEach(a => (byDec[decadeOf(a) || "?"] = byDec[decadeOf(a) || "?"] || []).push(a));
      Object.values(byDec).forEach(l => l.sort(() => Math.random() - .5));
      const decs = Object.keys(byDec).sort(() => Math.random() - .5), out = [];
      while (out.length < N && decs.some(k => byDec[k].length))
        for (const k of decs) if (byDec[k].length && out.length < N) out.push(byDec[k].pop());
      return out.sort(() => Math.random() - .5).map(a => a.id);
    }

    function fresh(){ d = null; set = pick(); mine = []; idx = 0; ask(); }

    // «Сравнить вкусы»: сначала мои вызовы (ждущие ответа и последние итоги), потом — новый
    async function start(){
      if (!inTg) return fail("Сравнение вкусов работает внутри Telegram");
      show(`${top("Сравнение вкусов")}<p>Загружаю…</p>`);
      let list = [];
      try { list = (await call("/api/duel/mine")).duels || []; } catch (e) {}
      if (!list.length) return fresh();
      Duel._list = list;
      const waiting = list.filter(x => x.role === "author" && !x.done);
      const finished = list.filter(x => x.done);
      let html = top("Сравнение вкусов");
      if (waiting.length) {
        html += `<div class="label">Ждут ответа</div><div class="rows">${waiting.slice(0, 3).map(x =>
          `<button class="row" data-duel="${x.id}"><div><b>Вызов от ${new Date(+x.created || Date.now()).toLocaleDateString("ru-RU", {day: "numeric", month: "long"})}</b><span>никто ещё не ответил · отправить или посмотреть</span></div></button>`).join("")}</div>`;
      }
      if (finished.length) {
        html += `<div class="label">Итоги</div><div class="rows">${finished.slice(0, 5).map(x => {
          const other = x.role === "author" ? x.b_name : x.a_name;
          const r = match(x.a_ans, x.b_ans);
          return `<button class="row" data-duel="${x.id}"><div><b>${esc(other)} — ${r.pct === null ? "мало общих" : r.pct + "%"}</b><span>${x.role === "author" ? "ответил на твой вызов" : "ты ответил на вызов"}</span></div></button>`;
        }).join("")}</div>`;
      }
      html += `<button class="go" data-x="fresh">Новый вызов</button><button class="alt" data-x="close">Вернуться в архив</button>`;
      show(html);
    }

    function openDuel(id){
      d = (Duel._list || []).find(x => x.id === id); if (!d) return;
      set = d.ids; mine = d.role === "author" ? d.a_ans : (d.b_ans || []);
      if (d.done) return result();

    }

    async function accept(sp){
      if (!/^x[a-f0-9]{10}$/.test(sp)) return fail("Этот вызов из старой версии. Пройди новый — кнопка «Сравнить вкусы» в архиве.");
      show(`${top("Сравнение вкусов")}<p>Загружаю…</p>`);
      try { d = await call("/api/duel/" + sp.slice(1)); } catch (e) { return fail("Не получилось загрузить вызов. Проверь интернет и открой ещё раз."); }
      if (!d || d.error) return fail(d && d.error === "Открой через Telegram" ? d.error : "Вызов не найден");
      set = d.ids; mine = []; idx = 0;
      if (d.role === "author") return d.done ? result() : show(`${top("Твой вызов")}
        <h3>Ждём ответа</h3><p>Пока никто не ответил. Как только кто-то пройдёт, сообщение в чате обновится, а бот напишет тебе в личку.</p>
        <button class="alt" data-x="close">Вернуться в архив</button>`);
      if (d.done) return result();       // соперник уже ответил — или ты и есть соперник, или вызов занят
      show(`${top("Сравнение вкусов")}<p>Вызов от: <b style="color:var(--ink)">${esc(d.a_name)}</b></p>
        <h3>${set.length} альбомов из архива</h3>
        <p>Ответь на те же — увидишь процент совпадения. Если альбом не слышал, так и отметь. Ответить может только один человек.</p>
        <button class="go" data-x="begin">Начать</button>`);
    }

    function ask(){
      const a = byId(set[idx]);
      if (!a) { mine[idx] = 0; return next(); }

        <div class="duel-bar"><i style="width:${idx / set.length * 100}%"></i></div>
        <div class="dcover">${a.has_cover ? `<img src="covers/${a.id}.${a.cover_ext || "webp"}" alt="">` : ""}</div>
        <div class="dmeta"><b>${esc(a.title)}</b><span>${esc(a.artist || "")}${a.year ? " · " + a.year : ""}</span></div>
        <div class="answers"><button data-a="1">Зашло</button><button data-a="2">Не зашло</button>

    function match(a, b){

      const styles = {};

    // результат: с точки зрения участника, а посторонним — просто итог двоих
    function result(note){
      const me = d.role === "author" ? d.a_ans : d.role === "opponent" ? d.b_ans : null;
      const them = d.role === "author" ? d.b_ans : d.a_ans;
      const themName = esc(d.role === "author" ? d.b_name : d.a_name);
      let html = top("Сравнение вкусов");
      if (note) html += `<p>${esc(note)}</p>`;
      if (!me) {
        const r = match(d.a_ans, d.b_ans);
        html += r.pct === null
          ? `<h3>${esc(d.a_name)} и ${esc(d.b_name)} почти не пересеклись</h3>`
          : `<div class="big">${r.pct}%</div><h3>${esc(d.a_name)} и ${esc(d.b_name)}</h3><p>Этот вызов уже принят. Хочешь сравниться сам — пройди свой.</p>`;
        html += `<button class="go" data-x="new">Пройти свой</button><button class="alt" data-x="close">Вернуться в архив</button>`;
        return show(html);
      }
      const r = match(me, them);
      html += r.pct === null
        ? `<h3>Ты и ${themName} почти не пересеклись</h3><p>Оба слышали только ${r.both} из ${set.length}. По такому процент не посчитать.</p>`
        : `<div class="big">${r.pct}%</div><h3>Совпадение вкусов: ты и ${themName}</h3><p>Оба слышали ${r.both} из ${set.length} альбомов и одинаково оценили ${r.same}.</p>`;
      const agree = set.map((id, i) => me[i] === 1 && them[i] === 1 ? byId(id) : null).filter(Boolean);
      const differ = set.map((id, i) => me[i] && them[i] && me[i] !== them[i] ? [byId(id), me[i]] : null).filter(x => x && x[0]);
      const onlyThem = set.map((id, i) => !me[i] && them[i] === 1 ? byId(id) : null).filter(Boolean);
      if (agree.length) html += `<div class="label">Обоим зашло</div><div class="rows">${agree.slice(0, 3).map(a => row(a)).join("")}</div>`;
      if (differ.length) html += `<div class="label">Разошлись</div><div class="rows">${differ.slice(0, 3).map(([a, v]) => row(a, v === 1 ? `ты: да · ${themName}: нет` : `ты: нет · ${themName}: да`)).join("")}</div>`;
      if (onlyThem.length) html += `<div class="label">${themName} советует, ты не слышал</div><div class="rows">${onlyThem.slice(0, 3).map(a => row(a)).join("")}</div>`;
      const author = set.map(id => { const a = byId(id); return a && a.author ? (a.author > 0 ? 1 : 2) : 0; });
      const ra = match(me, author);
      if (ra.pct !== null) html += `<p>С автором канала: <b style="color:var(--ink)">${ra.pct}%</b> (по ${ra.both} альбомам).</p>`;
      const rc = recs(me);
      if (rc.length) html += `<div class="label">Тебе может зайти</div><div class="rows">${rc.map(a => row(a, a.year || "")).join("")}</div>`;
      html += `<button class="go" data-x="new">Новый вызов</button><button class="alt" data-x="close">Вернуться в архив</button>`;
      show(html);
    }

    $("duel").addEventListener("click", e => {
      const a = e.target.closest("[data-a]"); if (a) return answer(+a.dataset.a);
      const o = e.target.closest("[data-open]"); if (o) { hide(); return open(+o.dataset.open); }
      const du = e.target.closest("[data-duel]"); if (du) return openDuel(du.dataset.duel);
      const x = e.target.closest("[data-x]"); if (!x) return;
      if (x.dataset.x === "close") hide();
      if (x.dataset.x === "new") start();
      if (x.dataset.x === "fresh") fresh();
      if (x.dataset.x === "begin") ask();
      if (x.dataset.x === "send" && d) {
        try { tgApp.switchInlineQuery(`вызов ${d.id}`, ["users", "groups"]); }
        catch (err) { fail("Обнови Telegram: эта версия не умеет отправлять вызовы из мини-приложения."); }
      }
    });
    return {start, accept};
  })();

  if (tgApp && tgApp.initData) {
    tgApp.ready(); tgApp.expand();
    document.documentElement.setAttribute("data-theme", tgApp.colorScheme === "dark" ? "dark" : "light");
    tgApp.onEvent("themeChanged", () =>
      document.documentElement.setAttribute("data-theme", tgApp.colorScheme === "dark" ? "dark" : "light"));
  }

  $("grid").addEventListener("click", e => { const t = e.target.closest(".tile"); if (t) open(+t.dataset.id); });
  $("decades").addEventListener("click", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    decade = c.dataset.d;
    document.querySelectorAll("#decades .chip").forEach(x => x.setAttribute("aria-pressed", x === c));
    apply();
  });
  let t; $("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(apply, 120); });
  $("sort").addEventListener("change", apply);
  $("genre").addEventListener("change", apply);
  $("stylepill").addEventListener("click", () => setStyle(""));
  $("s-tags").addEventListener("click", e => {
    const b = e.target.closest(".tag"); if (!b) return;
    if (b.dataset.genre) { $("genre").value = b.dataset.genre; style = ""; $("stylepill").hidden = true; apply(); }
    else setStyle(b.dataset.style);
    close(); window.scrollTo({top: 0});
  });
  $("more").addEventListener("click", more);
  $("duel-entry").addEventListener("click", () => Duel.start());
  $("s-vote").addEventListener("click", e => { const b = e.target.closest("button"); if (b && openId) vote(openId, +b.dataset.v); });
  $("sendbar-btn").addEventListener("click", send);
  $("rnd").addEventListener("click", () => { const pool = view.length ? view : all; open(pool[Math.floor(Math.random() * pool.length)].id); });
  $("scrim").addEventListener("click", close);
  $("close").addEventListener("click", close);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) close(); });
  window.addEventListener("hashchange", fromHash);

  fetch("data.json").then(r => r.json()).then(d => {
    all = d; buildGenres(); buildDecades();
    loadVotes().then(() => { apply(); paintSendbar(); fromHash(); fromTelegram(); });
  }).catch(() => { $("empty").hidden = false; $("empty").textContent = "Не удалось загрузить архив."; });
})();
</script>

</body>
</html>
