name: Проверка базы дуэлей (без личных данных)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: >-
            d1 execute archive-queue --remote --command
            "SELECT id, datetime(created/1000,'unixepoch') AS created, b_id IS NOT NULL AS has_opponent,
             b_ans IS NOT NULL AS answered, claimed IS NOT NULL AS claimed, msg IS NOT NULL AS has_msg, pct,
             a_id = b_id AS self_play FROM duels ORDER BY created DESC LIMIT 15"
