name: Дни рождения альбомов

on:
  schedule:
    - cron: "13 4 * * *"        # раз в сутки: новые альбомы и те, кого пора перепроверить
  workflow_dispatch:
    inputs:
      minutes:
        description: "Сколько минут работать"
        default: "40"
      only:
        description: "Только эти номера альбомов (через запятую)"
        default: ""
      all:
        description: "Проверить все заново"
        type: boolean
        default: false

# коммитит только dates.json — с ботом не пересекается; data.json пересоберёт бот,
# когда увидит, что dates.json изменился
concurrency:
  group: dates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install unidecode
      - name: Собрать даты выхода
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          MINUTES: ${{ inputs.minutes || '40' }}
          ONLY: ${{ inputs.only }}
          ALL: ${{ inputs.all && '1' || '' }}
        run: python bot/dates.py --minutes "$MINUTES" ${ONLY:+--only "$ONLY"} ${ALL:+--all}
      - name: Сохранить
        if: always()
        run: |
          git config user.name "volodyamusicbox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dates.json
          if git diff --cached --quiet; then echo "Ничего нового"; else
            git commit -m "Дни рождения альбомов [skip ci]"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
