name: Бот архива

on:
  schedule:
    - cron: "7,37 * * * *"      # запасной запуск раз в полчаса; основной — будильник cron-job.org раз в 5 минут
  workflow_dispatch:            # кнопка «Run workflow» — запустить вручную

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main     # всегда самая свежая версия, даже если запуск стоял в очереди

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pillow для обложек
        run: pip install pillow

      - name: Забрать новое из Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          DIARY_CHAT_ID: ${{ secrets.DIARY_CHAT_ID }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
        run: python bot/bot.py

      - name: Сохранить архив
        run: |
          git config user.name "volodyamusicbox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add albums.json data.json covers bot_state.json ratings.json
          if git diff --cached --quiet; then
            echo "Ничего нового"
          else
            git commit -m "Архив: обновление от бота"
            git pull --rebase
            git push
          fi
