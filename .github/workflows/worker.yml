name: Развернуть Cloudflare-воркер

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml", "index.html", "_headers"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Собрать мини-приложение для раздачи
        run: |
          mkdir -p worker/public
          cp index.html data.json _headers worker/public/
          cp -r covers worker/public/covers
          if [ -d wiki ]; then cp -r wiki worker/public/wiki; rm -f worker/public/wiki/state.json; fi

      - name: Таблицы базы (если ещё нет)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute archive-queue --remote --file schema.sql

      - name: Развернуть воркер и его секреты
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: deploy
          secrets: |
            BOT_TOKEN
            GH_TOKEN
            OWNER_ID
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}

      - name: Записать адрес воркера для бота
        run: |
          echo "${{ steps.deploy.outputs.deployment-url }}" | tr -d ' \n' > worker_url.txt
          cat worker_url.txt
          if [ ! -s worker_url.txt ]; then echo "Адрес воркера не получен"; exit 1; fi
          git config user.name "volodyamusicbox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker_url.txt
          git diff --cached --quiet || (git commit -m "Адрес Cloudflare-воркера" && git pull --rebase && git push)

      - name: Сразу запустить бота (он переключит Telegram на воркер)
        run: gh workflow run bot.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
