name = "volodya-archive"
main = "index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Мини-приложение (index.html, data.json, обложки) раздаётся отсюда как статика:
# такие запросы у Cloudflare бесплатные и безлимитные и не тратят лимит воркера.
# Папку public собирает GitHub перед развёртыванием.
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
REPO = "Begunka/volodya-music-box"
PAGES = "https://volodya-archive.zaharmakaka.workers.dev/"
MINIAPP = "https://t.me/volodyamusicbox_bot/archive"

[[d1_databases]]
binding = "DB"
database_name = "archive-queue"
database_id = "8473585c-83de-47b8-899a-3b1541d36b51"
